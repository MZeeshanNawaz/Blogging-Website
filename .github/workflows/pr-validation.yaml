name: PR Validation

on:
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    name: Lint HTML & CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install linters
        run: npm install --save-dev htmlhint stylelint stylelint-config-standard
      - name: HTMLHint
        run: npx htmlhint "src/**/*.html" --config .htmlhintrc.json
      - name: Stylelint
        run: npx stylelint "styles/**/*.css" --config .stylelintrc.json

  build:
    name: Build with Parcel
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install parcel --save-dev
      - name: Build
        run: npx parcel build src/*.html --dist-dir build
        with:
          path: "build"
          name: "Build-Artifact"
