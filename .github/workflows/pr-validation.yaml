name: PR Validation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

jobs:
  lint:
    name: PR Validation / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm install
      - name: Lint HTML Files With HTMLHint
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files With Stylelint
        run: npx stylelint "**/*.css"

  build:
    name: PR Validation / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm install
      - name: Test Building With Parcel
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./"
